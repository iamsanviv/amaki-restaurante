name: Publicar sitio en GitHub Pages

on:
  push:
    branches:
      - claude/amaki-restaurant-website-57wy5m
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancelar el que ya está corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          # El sitio es estático: se publica la raíz tal cual.
          path: .

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
